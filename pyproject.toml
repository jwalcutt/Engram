[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossmodalrag"
version = "0.1.0"
description = "Local-first foundation for a cross-modal memory distillation engine."
readme = "README.md"
# 3.11+ for stdlib tomllib (the config file). Core remains dependency-free.
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
embeddings = ["fastembed>=0.3", "numpy>=1.24"]
# Cross-modal ingestion. Each modality is opt-in so the core stays
# dependency-free; absent extras degrade gracefully (see crossmodalrag.capabilities).
pdf = ["pypdf>=4.0"]
ocr = ["pytesseract>=0.3", "pillow>=10.0"]
# Native (CLIP-class) image embeddings: gated, only adopted on measured benefit.
image-embeddings = ["fastembed>=0.3", "numpy>=1.24"]
# Local HTTP API (`mem serve`): the boundary the web UI calls.
# Opt-in so the core stays dependency-free; `httpx` powers FastAPI's TestClient.
ui = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# Tooling and test-only. `ruff check` reads the [tool.ruff] section below. `numpy` is here
# because parts of the suite import it unguarded, so it is needed to run the tests even
# though the library treats it as an [embeddings] concern.
dev = ["pytest>=8", "ruff>=0.6", "numpy>=1.24"]

[project.scripts]
mem = "crossmodalrag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the built web UI (served by `mem serve` with the [ui] extra).
"crossmodalrag.api" = ["static/**/*"]

[tool.ruff]
# Pinned so `ruff check` reports the same set on every machine and across ruff releases.
target-version = "py311"
line-length = 110
extend-exclude = ["web", "src/crossmodalrag/api/static"]

[tool.ruff.lint]
# Correctness and dead code, not style. F catches undefined names, unused imports and
# redefinitions; E4/E7/E9 cover import placement, statement-level mistakes and syntax errors;
# RUF100 keeps `# noqa` directives honest by flagging ones whose rule no longer fires.
# Deliberately excluded: the flake8-bandit `S` rules, whose only hits here are the parameterised
# variable-length `IN (?, ?, …)` clauses that S608 cannot distinguish from string-built SQL, and
# the stylistic families (I, UP, SIM, RUF beyond RUF100), which would rewrite working code for
# no correctness gain.
select = ["E4", "E7", "E9", "F", "RUF100"]
